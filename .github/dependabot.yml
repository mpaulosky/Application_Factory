# Dependabot version updates for the Factory (ADR 0009). Its own file, not the Template's Seed: the Factory has GitHub Actions, the local review's npm packages (ADR 0010)
# and the Template's hashed Python test pins (requirements-tests.txt, a pip block; ADR 0009's Update notes) to update, and the Template's Owned
# global.json, the .NET SDK every Application builds with, and the Factory's copy of it (a dotnet-sdk block; mpaulosky/Application_Factory#103, ADR 0017),
# and the C# test project's packages (a nuget block).
# For GitHub Actions and the SDK both directories are listed so one PR bumps an action in a copied workflow and in its source under template/owned/ together,
# or the gate's drift check would fail the copy. GitHub Actions also lists the Factory's template-tools action, whose pins Dependabot reads only there;
# test.sh holds its setup-dotnet pin equal to the Template ci.yml's (mpaulosky/Application_Factory#145). A major bump, which the minor-and-patch group leaves
# out, can come as one PR per folder, each failing that check or the drift check: move the pin in every folder on one of them, merge it, and close the others.
# Every label below must exist in the repo.
---

version: 2
updates:

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.claude/skills/repo-ci-baseline/template/owned"
      - "/.github/actions/template-tools"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken one is usually caught upstream first.
    cooldown:
      default-days: 7
    # The Template pins claude-code-action to the version claude-review.yml's sandbox notes were checked against.
    # It moves only through the Template, once they're checked again.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      # Minor and patch only: a major bump arrives as its own PR to look at.
      minor-and-patch-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken one is usually caught upstream first.
    cooldown:
      default-days: 7
    labels:
      - "npm"
      - "dependencies"
    groups:
      # Minor and patch only: a major bump arrives as its own PR to look at.
      minor-and-patch-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Template's Owned global.json and the Factory's copy of it at the root, as for GitHub Actions: the group bumps both in one PR, or the
  # gate's drift check would fail the copy (ADR 0017). The Factory moves the SDK for the whole Fleet: an Application's own bump would fail
  # the Owned files check, so the Seed has no dotnet-sdk block. An Application gets the bump by the next Rollout.
  # A patch bump (11.0.100 to 11.0.101) merges as it is. A new feature band or major (11.0.200, 12.0.100) fails test.sh, which holds
  # the Seed Dockerfile's DOTNET_CHANNEL to the pin's band: it waits for a commit on its branch that moves the channel, and for the
  # decision a new band needs. update-types can't tell the two apart: 11.0.100 to 11.0.200 is a semver patch.
  - package-ecosystem: "dotnet-sdk"
    directories:
      - "/"
      - "/.claude/skills/repo-ci-baseline/template/owned"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken one is usually caught upstream first.
    cooldown:
      default-days: 7
    labels:
      - "dotnet-sdk"
      - "dependencies"
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  # The Template's hashed pins for the Python tests (requirements-tests.txt, which CI installs with --require-hashes). Dependabot
  # rewrites the hashes with the versions. An Application gets the bump by the next Rollout.
  - package-ecosystem: "pip"
    directory: "/.claude/skills/repo-ci-baseline/template/owned/.github/scripts"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken one is usually caught upstream first.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    # ruff is bumped by hand, never here: its pin must be the release scripts/gate.sh's RUFF_VERSION names, inside RUFF_RELEASE's line, and
    # the Seed Dockerfile's ARG, so a bump of the pin alone fails test.sh (ADR 0011, Update: Python).
    ignore:
      - dependency-name: "ruff"
    groups:
      # Minor and patch only: a major bump arrives as its own PR to look at.
      minor-and-patch-pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The xUnit v3 project for the C# scripts (ADR 0017). Its shield files turn central package management off, so the versions are in
  # Scripts.Tests.csproj itself. It is the Factory's own, not Owned, so a bump reaches no Application.
  - package-ecosystem: "nuget"
    directory: "/.claude/skills/repo-ci-baseline/tests/Scripts.Tests"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken one is usually caught upstream first.
    cooldown:
      default-days: 7
    labels:
      - "nuget"
      - "dependencies"
    groups:
      # Minor and patch only: a major bump arrives as its own PR to look at.
      minor-and-patch-nuget:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
