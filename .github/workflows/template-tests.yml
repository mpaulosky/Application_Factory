---
name: repo-ci-baseline Template

# The workflow is named as the Template's PR Auto-Merge lists it under workflow_run; the job below is the "Template tests" check.
# Runs the repo-ci-baseline skill's test.sh on every change, so a broken Template
# is caught here before apply.sh copies it into other repos.
# This workflow belongs to the Application Factory; it isn't part of the Template.

"on":
  # Every PR, not only the Template's paths, so a required check never sits pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".claude/skills/repo-ci-baseline/**"
      - ".github/workflows/template-tests.yml"
      - ".github/hooks/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Template tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The versions scripts/gate.sh in the Template pins.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      MARKDOWNLINT_CLI2_VERSION: "0.24.0"
      YAMLLINT_VERSION: "1.38.0"
      ZIZMOR_VERSION: "1.30.1"
      CMARKGFM_VERSION: "2025.10.22"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The Template's repos use pnpm, never npm, so markdownlint-cli2 comes from pnpm too.
      # This repo has no package.json, so the version is given here: the one the Template's Seed package.json pins.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # shellcheck, git, node and Ruby come with the runner image.
      - name: Install lint tools
        run: |
          python -m pip install pytest "yamllint==${YAMLLINT_VERSION}" "zizmor==${ZIZMOR_VERSION}" "cmarkgfm==${CMARKGFM_VERSION}"
          # The renderer oracle's kramdown, at the versions the github-pages gem pins.
          sudo gem install --no-document kramdown:2.4.0 kramdown-parser-gfm:1.1.0
          pnpm add -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The same gate the pre-push hook runs: scripts/gate.sh's own test, the check that the Factory's copies of Template files
      # match the Template's, then test.sh. A push from a clone without active hooks is still held to the copies.
      - name: Run the gate
        run: bash "scripts/gate.sh"

      # Sandcastle's type-check and tests (.sandcastle/), on a throwaway repo the Template was Applied to. test.sh doesn't run
      # it: it needs the network and takes the newest packages the Seed's ranges allow, as a new repo does.
      - name: Check Sandcastle
        run: bash ".claude/skills/repo-ci-baseline/tests/sandcastle-check.test.sh"
