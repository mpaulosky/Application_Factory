---
name: repo-ci-baseline Template

# The workflow is named as the Template's PR Auto-Merge lists it under workflow_run; the job named "Template tests" is the check the ruleset requires.
# It runs the Factory's gate (scripts/gate.sh) one part per job, in parallel, and test.sh as three shards of the template part, then a last job that passes
# only when every part did (ADR 0012, ADR 0013).
# Every part is the same code the pre-push hook runs locally: CI has no review ledger, so the template part skips the local review check (ADR 0010).
# This workflow belongs to the Application Factory; it isn't part of the Template.

"on":
  # Every PR, not only the Template's paths, so a required check never sits pending.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self:
    name: Gate - self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        uses: ./.github/actions/template-tools

      # scripts/gate.sh's own test.
      - name: Run the gate part
        env:
          GATE_PART: self
        run: bash "scripts/gate.sh"

  review:
    name: Gate - review tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        uses: ./.github/actions/template-tools

      # The review's stand-alone tests (the gate installs the review's packages, tsx and zod, itself).
      - name: Run the gate part
        env:
          GATE_PART: review
        run: bash "scripts/gate.sh"

  static:
    name: Gate - copies, lint, shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        uses: ./.github/actions/template-tools

      # The Factory's copies of Template files, the issue-reference and git status checks, the Markdown and YAML lint, shellcheck of the shell files.
      - name: Run the gate part
        env:
          GATE_PART: static
        run: bash "scripts/gate.sh"

  # test.sh in three shards, one job each (ADR 0013). needs.template.result is failure when any shard failed, so the aggregator still sees one result.
  template:
    name: Gate - test.sh (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [hooks, scripts, checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        uses: ./.github/actions/template-tools

      # The repo-ci-baseline skill's test.sh. CI has no .git/review/ ledger, so the local review check is skipped (ADR 0010); the pre-push hook removes the variable, so a push never skips it.
      - name: Run the gate part
        env:
          GATE_PART: template
          TEST_SH_SHARD: ${{ matrix.shard }}
          GATE_SKIP_REVIEW: "1"
        run: bash "scripts/gate.sh"

  sandcastle:
    name: Gate - Sandcastle check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        uses: ./.github/actions/template-tools

      # Sandcastle's type-check and tests (.sandcastle/), on a throwaway repo the Template was Applied to. It needs the network and takes the newest
      # packages the Seed's ranges allow, as a new repo does.
      - name: Run the gate part
        env:
          GATE_PART: sandcastle
        run: bash "scripts/gate.sh"

  # The one check the ruleset requires, PR Auto-Merge waits for and the Sandcastle host reads by name. It passes only when every part passed; always() so a
  # failed or skipped part fails it, not leaves it skipped (a skipped required check counts as passing).
  test:
    name: Template tests
    if: ${{ always() }}
    needs: [self, review, static, template, sandcastle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 5 and all(.[]; .result == "success")' > /dev/null
