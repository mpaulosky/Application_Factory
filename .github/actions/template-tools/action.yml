---
name: Template tools
description: >
  The tools the Factory's gate needs (Python, pnpm, Node, the linters), at the versions scripts/gate.sh in the Template pins.
  Used by every job of the repo-ci-baseline Template workflow (ADR 0012). It belongs to the Application Factory; it isn't part of the Template.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    # The Template's repos use pnpm, never npm, so markdownlint-cli2 comes from pnpm too.
    # The version is given here, the one package.json and the Template's Seed package.json pin.
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: "12.6.0"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"

    # shellcheck, git, node and Ruby come with the runner image.
    - name: Install lint tools
      shell: bash
      env:
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        MARKDOWNLINT_CLI2_VERSION: "0.24.0"
        YAMLLINT_VERSION: "1.38.0"
        ZIZMOR_VERSION: "1.30.1"
        CMARKGFM_VERSION: "2025.10.22"
      run: |
        python -m pip install pytest "yamllint==${YAMLLINT_VERSION}" "zizmor==${ZIZMOR_VERSION}" "cmarkgfm==${CMARKGFM_VERSION}"
        # The renderer oracle's kramdown, at the versions the github-pages gem pins.
        sudo gem install --no-document kramdown:2.4.0 kramdown-parser-gfm:1.1.0
        pnpm add -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
        # Into a folder already on PATH, so no step writes GITHUB_PATH (zizmor's github-env audit flags it in an action).
        sudo tar -xzf "$archive" -C /usr/local/bin actionlint
